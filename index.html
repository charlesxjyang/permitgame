<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Permitting Game</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>The Permitting Game</h1>
            <p class="subtitle">Why regulatory uncertainty kills projects that "should" get built</p>
        </header>

        <nav class="scenario-nav" id="scenarioNav">
            <button class="scenario-btn active" data-scenario="1">1. Baseline</button>
            <button class="scenario-btn locked" data-scenario="2">2. Known Delay</button>
            <button class="scenario-btn locked" data-scenario="3">3. Uncertain Delay</button>
            <button class="scenario-btn locked" data-scenario="4">4. Recursive Risk</button>
            <button class="scenario-btn locked" data-scenario="5">5. Carrying Costs</button>
            <button class="scenario-btn locked" data-scenario="6">6. Mitigation</button>
        </nav>

        <div class="main-grid">
            <!-- Left: Pipeline visualization -->
            <div class="panel pipeline-panel">
                <h2 class="panel-title">Project Pipeline</h2>
                <div class="pipeline" id="pipeline">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Center Top: Scenario & Controls -->
            <div class="panel scenario-panel">
                <div class="scenario-info" id="scenarioInfo">
                    <!-- Populated by JS -->
                </div>

                <div id="controls">
                    <!-- Populated by JS -->
                </div>

                <div class="insight" id="insight">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Center Bottom: DCF Chart -->
            <div class="panel chart-panel">
                <h2 class="panel-title">Cash Flow Timeline</h2>
                <div class="chart-legend-custom">
                    <div class="legend-item-custom">
                        <div class="legend-line" style="background: var(--accent-green);"></div>
                        <span>Cumulative Cash Flow (Nominal)</span>
                    </div>
                    <div class="legend-item-custom">
                        <div class="legend-line dashed"></div>
                        <span>Cumulative Cash Flow (Discounted)</span>
                    </div>
                    <div class="legend-item-custom">
                        <div class="legend-line" style="background: var(--accent-red); opacity: 0.5;"></div>
                        <span>Annual Cash Flow</span>
                    </div>
                    <div class="legend-item-custom">
                        <div class="legend-line" style="background: var(--accent-yellow); height: 12px; width: 12px;"></div>
                        <span>Permitting Delay Period</span>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="dcfChart"></canvas>
                </div>
                <div class="chart-metrics" id="chartMetrics">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Right: Financial Results -->
            <div class="panel results-panel">
                <h2 class="panel-title">Financial Analysis</h2>
                <div id="results">
                    <!-- Populated by JS -->
                </div>

                <div class="decision-box" id="decisionBox">
                    <div class="decision-label">Investment Decision</div>
                    <div class="decision-text" id="decisionText">INVEST</div>
                    <div class="decision-reason" id="decisionReason"></div>
                </div>

                <div class="math-breakdown" id="mathBreakdown">
                    <!-- Populated by JS -->
                </div>

                <div class="next-scenario" id="nextScenario">
                    <button class="next-btn" id="nextBtn">
                        Continue to Next Scenario →
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="calculations.js"></script>
</body>
</html>
