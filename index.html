<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Permitting Game</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0b;
            --bg-card: #141416;
            --bg-elevated: #1a1a1e;
            --border: #2a2a2e;
            --text-primary: #e8e8e8;
            --text-secondary: #888;
            --text-muted: #555;
            --accent-green: #22c55e;
            --accent-green-dim: #166534;
            --accent-red: #ef4444;
            --accent-red-dim: #7f1d1d;
            --accent-yellow: #eab308;
            --accent-blue: #3b82f6;
            --accent-purple: #a855f7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-family: 'Fraunces', serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .scenario-nav {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .scenario-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .scenario-btn:hover {
            border-color: var(--text-secondary);
        }

        .scenario-btn.active {
            background: var(--bg-elevated);
            border-color: var(--accent-blue);
            color: var(--text-primary);
        }

        .scenario-btn.locked {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .scenario-btn.locked::after {
            content: '🔒';
            margin-left: 0.5rem;
            font-size: 0.7rem;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            gap: 1.5rem;
            align-items: start;
        }

        .pipeline-panel {
            grid-column: 1;
            grid-row: 1 / 3;
        }

        .scenario-panel {
            grid-column: 2;
            grid-row: 1;
        }

        .chart-panel {
            grid-column: 2;
            grid-row: 2;
        }

        .results-panel {
            grid-column: 3;
            grid-row: 1 / 3;
        }

        @media (max-width: 1200px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .pipeline-panel,
            .scenario-panel,
            .chart-panel,
            .results-panel {
                grid-column: 1;
                grid-row: auto;
            }
        }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 1.5rem;
        }

        .panel-title {
            font-family: 'Fraunces', serif;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .panel-title::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--accent-blue);
        }

        /* Pipeline visualization */
        .pipeline {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .pipeline-stage {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            background: var(--bg-elevated);
            border-left: 3px solid var(--border);
            transition: all 0.3s;
            position: relative;
        }

        .pipeline-stage.active {
            border-left-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.1);
        }

        .pipeline-stage.delayed {
            border-left-color: var(--accent-yellow);
            background: rgba(234, 179, 8, 0.1);
        }

        .pipeline-stage.blocked {
            border-left-color: var(--accent-red);
            background: rgba(239, 68, 68, 0.1);
        }

        .pipeline-stage.complete {
            border-left-color: var(--accent-green);
        }

        .stage-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .stage-info {
            flex: 1;
        }

        .stage-name {
            font-size: 0.8rem;
            color: var(--text-primary);
        }

        .stage-detail {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .stage-probability {
            font-size: 0.7rem;
            color: var(--accent-yellow);
            padding: 0.2rem 0.4rem;
            background: rgba(234, 179, 8, 0.15);
        }

        /* Controls */
        .control-group {
            margin-bottom: 1.5rem;
        }

        .control-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .control-value.positive {
            color: var(--accent-green);
        }

        .control-value.negative {
            color: var(--accent-red);
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent-blue);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        /* Results panel */
        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
        }

        .result-row:last-child {
            border-bottom: none;
        }

        .result-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .result-value {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .result-value.highlight {
            font-size: 1.1rem;
        }

        /* Decision indicator */
        .decision-box {
            margin-top: 1.5rem;
            padding: 1.25rem;
            text-align: center;
            border: 2px solid;
            position: relative;
            overflow: hidden;
        }

        .decision-box.invest {
            border-color: var(--accent-green);
            background: rgba(34, 197, 94, 0.1);
        }

        .decision-box.reject {
            border-color: var(--accent-red);
            background: rgba(239, 68, 68, 0.1);
        }

        .decision-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
        }

        .decision-text {
            font-family: 'Fraunces', serif;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .decision-box.invest .decision-text {
            color: var(--accent-green);
        }

        .decision-box.reject .decision-text {
            color: var(--accent-red);
        }

        .decision-reason {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        /* Scenario explanation */
        .scenario-info {
            background: var(--bg-elevated);
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            border-left: 3px solid var(--accent-purple);
        }

        .scenario-title {
            font-family: 'Fraunces', serif;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }

        .scenario-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        /* Math breakdown */
        .math-breakdown {
            background: var(--bg-dark);
            padding: 1rem;
            margin-top: 1rem;
            font-size: 0.75rem;
            border: 1px dashed var(--border);
        }

        .math-line {
            display: flex;
            justify-content: space-between;
            padding: 0.25rem 0;
            color: var(--text-secondary);
        }

        .math-line.result {
            border-top: 1px solid var(--border);
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Progress to next scenario */
        .next-scenario {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }

        .next-btn {
            width: 100%;
            padding: 1rem;
            background: var(--accent-blue);
            border: none;
            color: white;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .next-btn:hover {
            background: #2563eb;
        }

        .next-btn:disabled {
            background: var(--border);
            cursor: not-allowed;
        }

        /* Insight callout */
        .insight {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 1rem;
            margin-top: 1rem;
            font-size: 0.8rem;
        }

        .insight-title {
            color: var(--accent-purple);
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .insight-text {
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* Toggle switch */
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .toggle {
            position: relative;
            width: 44px;
            height: 24px;
            background: var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .toggle.active {
            background: var(--accent-blue);
        }

        .toggle::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        .toggle.active::after {
            transform: translateX(20px);
        }

        .toggle-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .pulsing {
            animation: pulse 2s infinite;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide-in {
            animation: slideIn 0.3s ease-out;
        }

        /* Chart styles */
        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 1rem;
        }

        .chart-legend-custom {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .legend-item-custom {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .legend-line {
            width: 20px;
            height: 3px;
            border-radius: 2px;
        }

        .legend-line.dashed {
            background: repeating-linear-gradient(
                90deg,
                var(--accent-blue) 0px,
                var(--accent-blue) 4px,
                transparent 4px,
                transparent 8px
            );
        }

        .chart-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }

        .chart-metric {
            text-align: center;
            padding: 1rem;
            background: var(--bg-elevated);
        }

        .chart-metric-value {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .chart-metric-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .delay-marker {
            position: absolute;
            top: 0;
            bottom: 40px;
            width: 2px;
            background: var(--accent-yellow);
            opacity: 0.5;
        }

        .delay-zone {
            position: absolute;
            top: 0;
            bottom: 40px;
            background: rgba(234, 179, 8, 0.1);
            border-left: 2px dashed var(--accent-yellow);
        }

        /* Probability bars */
        .prob-bar-container {
            margin: 1rem 0;
        }

        .prob-bar {
            display: flex;
            height: 24px;
            border-radius: 2px;
            overflow: hidden;
        }

        .prob-segment {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
            transition: width 0.3s;
        }

        .prob-segment.short {
            background: var(--accent-green);
            color: white;
        }

        .prob-segment.long {
            background: var(--accent-yellow);
            color: black;
        }

        .prob-segment.restart {
            background: var(--accent-red);
            color: white;
        }

        .prob-legend {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .legend-dot {
            width: 8px;
            height: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>The Permitting Game</h1>
            <p class="subtitle">Why regulatory uncertainty kills projects that "should" get built</p>
        </header>

        <nav class="scenario-nav" id="scenarioNav">
            <button class="scenario-btn active" data-scenario="1">1. Baseline</button>
            <button class="scenario-btn locked" data-scenario="2">2. Known Delay</button>
            <button class="scenario-btn locked" data-scenario="3">3. Uncertain Delay</button>
            <button class="scenario-btn locked" data-scenario="4">4. Recursive Risk</button>
            <button class="scenario-btn locked" data-scenario="5">5. Carrying Costs</button>
            <button class="scenario-btn locked" data-scenario="6">6. Mitigation</button>
        </nav>

        <div class="main-grid">
            <!-- Left: Pipeline visualization -->
            <div class="panel pipeline-panel">
                <h2 class="panel-title">Project Pipeline</h2>
                <div class="pipeline" id="pipeline">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Center Top: Scenario & Controls -->
            <div class="panel scenario-panel">
                <div class="scenario-info" id="scenarioInfo">
                    <!-- Populated by JS -->
                </div>

                <div id="controls">
                    <!-- Populated by JS -->
                </div>

                <div class="insight" id="insight">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Center Bottom: DCF Chart -->
            <div class="panel chart-panel">
                <h2 class="panel-title">Cash Flow Timeline</h2>
                <div class="chart-legend-custom">
                    <div class="legend-item-custom">
                        <div class="legend-line" style="background: var(--accent-green);"></div>
                        <span>Cumulative Cash Flow (Nominal)</span>
                    </div>
                    <div class="legend-item-custom">
                        <div class="legend-line dashed"></div>
                        <span>Cumulative Cash Flow (Discounted)</span>
                    </div>
                    <div class="legend-item-custom">
                        <div class="legend-line" style="background: var(--accent-red); opacity: 0.5;"></div>
                        <span>Annual Cash Flow</span>
                    </div>
                    <div class="legend-item-custom">
                        <div class="legend-line" style="background: var(--accent-yellow); height: 12px; width: 12px;"></div>
                        <span>Permitting Delay Period</span>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="dcfChart"></canvas>
                </div>
                <div class="chart-metrics" id="chartMetrics">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Right: Financial Results -->
            <div class="panel results-panel">
                <h2 class="panel-title">Financial Analysis</h2>
                <div id="results">
                    <!-- Populated by JS -->
                </div>
                
                <div class="decision-box" id="decisionBox">
                    <div class="decision-label">Investment Decision</div>
                    <div class="decision-text" id="decisionText">INVEST</div>
                    <div class="decision-reason" id="decisionReason"></div>
                </div>

                <div class="math-breakdown" id="mathBreakdown">
                    <!-- Populated by JS -->
                </div>

                <div class="next-scenario" id="nextScenario">
                    <button class="next-btn" id="nextBtn">
                        Continue to Next Scenario →
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Game state
        const state = {
            currentScenario: 1,
            unlockedScenarios: 1,
            
            // Base parameters
            hurdleRate: 12,
            baseReturn: 18, // Target IRR for the project with no delay
            projectValue: 100, // $100M project for illustration
            
            // Project structure (renewable energy style)
            capex: 100, // $100M upfront
            opexRate: 4, // $4M per year operating costs (fixed)
            projectLife: 25, // 25 year project life
            constructionTime: 1, // 1 year to build after permits
            
            // Scenario-specific
            knownDelay: 1,
            shortDelay: 1,
            longDelay: 3,
            shortDelayProb: 50,
            restartProb: 10,
            annualCarryingCost: 2, // % of project value per year
            mitigationCost: 5, // % of project value
            mitigationReduction: 30, // % reduction in delay probability
            useMitigation: false
        };

        // Chart instance
        let dcfChart = null;

        // Calculate annual revenue needed to achieve target IRR with no delay
        // Uses numerical solver to match exact cash flow structure
        // Baseline (no delay): CAPEX at year 0, operations start year 1
        function getAnnualRevenue() {
            const targetIRR = state.baseReturn / 100;
            
            // Binary search for the net cash flow that gives target IRR
            let low = 0;
            let high = state.capex * 2; // Upper bound
            let netCF = (low + high) / 2;
            
            for (let iter = 0; iter < 50; iter++) {
                // Build cash flows with current guess (no delay scenario)
                // Year 0: CAPEX deployed
                // Years 1 to projectLife: Operations
                const cashFlows = [-state.capex]; // Year 0: CAPEX
                for (let y = 1; y <= state.projectLife; y++) {
                    cashFlows.push(netCF); // Years 1 to projectLife: operations
                }
                
                // Calculate IRR of these cash flows
                const irr = calculateIRRFromFlows(cashFlows);
                
                if (Math.abs(irr - targetIRR) < 0.0001) {
                    break;
                }
                
                if (irr < targetIRR) {
                    low = netCF; // Need higher cash flows
                } else {
                    high = netCF; // Need lower cash flows
                }
                netCF = (low + high) / 2;
            }
            
            return netCF + state.opexRate;
        }
        
        // IRR calculation helper - takes array of cash flows
        function calculateIRRFromFlows(cashFlows) {
            let guess = 0.1;
            const maxIterations = 100;
            const tolerance = 0.00001;
            
            for (let i = 0; i < maxIterations; i++) {
                let npv = 0;
                let dnpv = 0;
                
                for (let t = 0; t < cashFlows.length; t++) {
                    const factor = Math.pow(1 + guess, -t);
                    npv += cashFlows[t] * factor;
                    dnpv -= t * cashFlows[t] * Math.pow(1 + guess, -t - 1);
                }
                
                if (Math.abs(dnpv) < 1e-10) break;
                
                const newGuess = guess - npv / dnpv;
                
                if (Math.abs(newGuess - guess) < tolerance) {
                    return newGuess;
                }
                
                // Clamp to avoid divergence
                guess = Math.max(-0.99, Math.min(newGuess, 10));
            }
            
            return guess;
        }

        // Scenario definitions
        const scenarios = {
            1: {
                title: "Scenario 1: The Baseline",
                description: "A simple world: Your company evaluates projects against a hurdle rate. If expected returns exceed the hurdle, you invest. No delays, no uncertainty.",
                insight: "This is the textbook case. Projects that clear the hurdle get built. In reality, this scenario almost never exists.",
                pipeline: [
                    { name: "Project Conception", icon: "💡", status: "complete" },
                    { name: "Investment Decision", icon: "💰", status: "active" },
                    { name: "Construction", icon: "🏗️", status: "pending" },
                    { name: "Returns", icon: "📈", status: "pending" }
                ]
            },
            2: {
                title: "Scenario 2: The Known Delay",
                description: "Now reality intrudes: every project must wait for permits. You've already committed capital—land options, engineering, equipment deposits—so the clock is ticking from day one.",
                insight: "With capital deployed at t=0, delays are devastating. Your money is tied up earning nothing while you wait. A 3-year delay doesn't just push returns back—it means 3 years of zero return on committed capital. Watch both NPV and IRR drop as you increase the delay.",
                pipeline: [
                    { name: "Project Conception", icon: "💡", status: "complete" },
                    { name: "Permitting Queue", icon: "📋", status: "delayed", detail: "Waiting..." },
                    { name: "Investment Decision", icon: "💰", status: "active" },
                    { name: "Construction", icon: "🏗️", status: "pending" },
                    { name: "Returns", icon: "📈", status: "pending" }
                ]
            },
            3: {

        // Calculate NPV for baseline (no delay) case
        function calculateBaselineNPV() {
            const annualRevenue = getAnnualRevenue();
            const annualNetCF = annualRevenue - state.opexRate;
            
            let npv = 0;
            // Year 0: CAPEX
            npv -= state.capex;
            // Years 1 to projectLife: net cash flow
            for (let y = 1; y <= state.projectLife; y++) {
                npv += annualNetCF / Math.pow(1 + state.hurdleRate / 100, y);
            }
            return npv;
        }

        function getExpectedDelay() {
            switch (state.currentScenario) {
                case 1:
                    return 0;
                case 2:
                    return state.knownDelay;
                case 3:
                case 4:
                case 5:
                case 6:
                    const p_short = state.shortDelayProb / 100;
                    const p_long = 1 - p_short;
                    let expectedSingleDelay = p_short * state.shortDelay + p_long * state.longDelay;
                    
                    // Apply mitigation in scenario 6
                    if (state.currentScenario === 6 && state.useMitigation) {
                        const mitigationFactor = 1 - state.mitigationReduction / 100;
                        const p_long_adj = p_long * mitigationFactor;
                        expectedSingleDelay = (1 - p_long_adj) * state.shortDelay + p_long_adj * state.longDelay;
                    }
                    
                    if (state.currentScenario >= 4) {
                        let p_restart = state.restartProb / 100;
                        if (state.currentScenario === 6 && state.useMitigation) {
                            p_restart *= (1 - state.mitigationReduction / 100);
                        }
                        const expectedAttempts = 1 / (1 - p_restart);
                        return expectedSingleDelay * expectedAttempts;
                    }
                    return expectedSingleDelay;
                default:
                    return 0;
            }
        }

        function generateCashFlows() {
            const delay = getExpectedDelay();
            // Timeline: 
            // Year 0: CAPEX deployed (always)
            // Years 1 to delay: Waiting for permits (carrying costs if applicable)
            // Years (delay+1) to (delay+projectLife): Operations
            const operationsStart = Math.floor(delay) + 1;
            const operationsEnd = Math.floor(delay) + state.projectLife;
            
            // Get the annual revenue that corresponds to the target IRR
            const annualRevenue = getAnnualRevenue();
            const annualNetCF = annualRevenue - state.opexRate;
            
            const years = [];
            const annualCashFlows = [];
            const cumulativeNominal = [];
            const cumulativeDiscounted = [];
            
            let cumNominal = 0;
            let cumDiscounted = 0;
            
            // Calculate carrying costs per year during delay
            const annualCarrying = state.currentScenario >= 5 
                ? state.capex * (state.annualCarryingCost / 100)
                : 0;
            
            // Mitigation cost upfront
            const mitigationSpend = (state.currentScenario >= 6 && state.useMitigation)
                ? state.capex * (state.mitigationCost / 100)
                : 0;
            
            // Generate cash flows year by year
            const maxYears = Math.max(operationsEnd + 1, 12);
            
            for (let year = 0; year <= maxYears; year++) {
                years.push(year);
                
                let cashFlow = 0;
                
                // Year 0: CAPEX + Mitigation cost if applicable
                if (year === 0) {
                    cashFlow -= state.capex;
                    if (mitigationSpend > 0) {
                        cashFlow -= mitigationSpend;
                    }
                }
                
                // During delay period: carrying costs (years 1 through delay)
                if (delay > 0 && year >= 1 && year <= Math.floor(delay)) {
                    cashFlow -= annualCarrying;
                }
                
                // Operations: Revenue - Opex
                if (year >= operationsStart && year <= operationsEnd) {
                    cashFlow += annualNetCF;
                }
                
                annualCashFlows.push(cashFlow);
                
                cumNominal += cashFlow;
                cumulativeNominal.push(cumNominal);
                
                const discountFactor = Math.pow(1 + state.hurdleRate / 100, -year);
                cumDiscounted += cashFlow * discountFactor;
                cumulativeDiscounted.push(cumDiscounted);
            }
            
            return {
                years,
                annualCashFlows,
                cumulativeNominal,
                cumulativeDiscounted,
                delay,
                operationsStart,
                operationsEnd,
                npv: cumDiscounted,
                paybackNominal: findPayback(years, cumulativeNominal),
                paybackDiscounted: findPayback(years, cumulativeDiscounted),
                irr: calculateIRR(annualCashFlows),
                annualRevenue,
                annualNetCF
            };
        }

        function findPayback(years, cumulative) {
            for (let i = 0; i < cumulative.length; i++) {
                if (cumulative[i] >= 0) {
                    if (i === 0) return 0;
                    // Linear interpolation
                    const prev = cumulative[i - 1];
                    const curr = cumulative[i];
                    return years[i - 1] + (-prev) / (curr - prev);
                }
            }
            return null; // Never pays back
        }

        function calculateIRR(cashFlows) {
            // Newton-Raphson method for IRR
            let guess = 0.1;
            const maxIterations = 100;
            const tolerance = 0.0001;
            
            for (let i = 0; i < maxIterations; i++) {
                let npv = 0;
                let dnpv = 0;
                
                for (let t = 0; t < cashFlows.length; t++) {
                    const factor = Math.pow(1 + guess, -t);
                    npv += cashFlows[t] * factor;
                    dnpv -= t * cashFlows[t] * Math.pow(1 + guess, -t - 1);
                }
                
                if (Math.abs(dnpv) < 1e-10) break;
                
                const newGuess = guess - npv / dnpv;
                
                if (Math.abs(newGuess - guess) < tolerance) {
                    return newGuess * 100;
                }
                
                guess = newGuess;
            }
            
            return guess * 100;
        }

                            backgroundColor: '#1a1a1e',
                            borderColor: '#2a2a2e',
                            borderWidth: 1,
                            titleFont: {
                                family: 'JetBrains Mono'
                            },
                            bodyFont: {
                                family: 'JetBrains Mono'
                            },
                            callbacks: {
                                title: (items) => `Year ${items[0].label}`,
                                label: (item) => {
                                    const value = item.parsed.y;
                                    const sign = value >= 0 ? '+' : '';
                                    return `${item.dataset.label}: ${sign}$${value.toFixed(1)}M`;
                                }
                            }
                        },
                        annotation: {
                            annotations: data.delay > 0 ? {
                                delayZone: {
                                    type: 'box',
                                    xMin: 0,
                                    xMax: data.delay,
                                    backgroundColor: 'rgba(234, 179, 8, 0.1)',
                                    borderColor: 'rgba(234, 179, 8, 0.5)',
                                    borderWidth: 1,
                                    borderDash: [5, 5],
                                    label: {
                                        display: true,
                                        content: 'Permitting',
                                        position: 'start'
                                    }
                                }
                            } : {}
                        }
                    },
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: 'Year',
                                color: '#888',
                                font: {
                                    family: 'JetBrains Mono',
                                    size: 11
                                }
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.05)'
                            },
                            ticks: {
                                color: '#888',
                                font: {
                                    family: 'JetBrains Mono',
                                    size: 10
                                }
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'Cash Flow ($M)',
                                color: '#888',
                                font: {
                                    family: 'JetBrains Mono',
                                    size: 11
                                }
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.05)'
                            },
                            ticks: {
                                color: '#888',
                                font: {
                                    family: 'JetBrains Mono',
                                    size: 10
                                },
                                callback: (value) => `$${value}M`
                            }
                        }
                    }
                }
            });
            
            // Render metrics
            const metrics = document.getElementById('chartMetrics');
            const paybackText = data.paybackDiscounted 
                ? `${data.paybackDiscounted.toFixed(1)} yrs`
                : 'Never';
            const npvClass = data.npv >= 0 ? 'positive' : 'negative';
            const irrClass = data.irr >= state.hurdleRate ? 'positive' : 'negative';
            
            metrics.innerHTML = `
                <div class="chart-metric">
                    <div class="chart-metric-value ${npvClass}">$${data.npv.toFixed(1)}M</div>
                    <div class="chart-metric-label">Net Present Value</div>
                </div>
                <div class="chart-metric">
                    <div class="chart-metric-value ${irrClass}">${data.irr.toFixed(1)}%</div>
                    <div class="chart-metric-label">Internal Rate of Return</div>
                </div>
                <div class="chart-metric">
                    <div class="chart-metric-value">${paybackText}</div>
                    <div class="chart-metric-label">Discounted Payback</div>
                </div>
                <div class="chart-metric">
                    <div class="chart-metric-value" style="color: var(--accent-yellow);">${data.delay.toFixed(1)} yrs</div>
                    <div class="chart-metric-label">Expected Permitting Delay</div>
                </div>
            `;
        }

        function renderNextButton() {
            const nextBtn = document.getElementById('nextBtn');
            const hasNext = state.currentScenario < Object.keys(scenarios).length;
            
            if (hasNext) {
                nextBtn.textContent = `Continue to Scenario ${state.currentScenario + 1} →`;
                nextBtn.disabled = false;
            } else {
                nextBtn.textContent = 'All scenarios complete!';
                nextBtn.disabled = true;
            }
        }

        function renderScenarioNav() {
            const nav = document.getElementById('scenarioNav');
            const buttons = nav.querySelectorAll('.scenario-btn');
            
            buttons.forEach(btn => {
                const scenario = parseInt(btn.dataset.scenario);
                btn.classList.remove('active', 'locked');
                
                if (scenario === state.currentScenario) {
                    btn.classList.add('active');
                } else if (scenario > state.unlockedScenarios) {
                    btn.classList.add('locked');
                }
            });
        }

        function switchScenario(scenario) {
            if (scenario <= state.unlockedScenarios) {
                state.currentScenario = scenario;
                renderAll();
            }
        }

        function nextScenario() {
            if (state.currentScenario < Object.keys(scenarios).length) {
                state.currentScenario++;
                state.unlockedScenarios = Math.max(state.unlockedScenarios, state.currentScenario);
                renderAll();
            }
        }

        function renderAll() {
            renderScenarioNav();
            renderPipeline();
            renderScenarioInfo();
            renderControls();
            renderResults();
            renderInsight();
            renderNextButton();
            renderChart();
        }

        // Event listeners
        document.getElementById('scenarioNav').addEventListener('click', (e) => {
            if (e.target.classList.contains('scenario-btn') && !e.target.classList.contains('locked')) {
                switchScenario(parseInt(e.target.dataset.scenario));
            }
        });

        document.getElementById('nextBtn').addEventListener('click', nextScenario);

        // Initialize
        renderAll();
    </script>
</body>
</html>
